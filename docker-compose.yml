services:
  db:
    image: container-registry.oracle.com/mysql/community-server:8.4
    container_name: ternnest_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - ternnest_mysql_data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: ternnest-web:local
    container_name: ternnest_web
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      SECRET_KEY: "${SECRET_KEY}"
      DEBUG: "${DEBUG:-True}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"

      API_VERSION: "${API_VERSION:-v1}"
      API_PREFIX: "${API_PREFIX:-api}"

      MYSQL: "True"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_HOST: "db"
      MYSQL_PORT: "3306"

      DJANGO_LANGUAGE_CODE: "${DJANGO_LANGUAGE_CODE:-en-us}"
      DJANGO_TIME_ZONE: "${DJANGO_TIME_ZONE:-UTC}"

      AI_AGENT_ENABLED: "${AI_AGENT_ENABLED:-False}"
      AI_PROVIDER: "${AI_PROVIDER:-openai}"
      AI_MODEL: "${AI_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

    expose:
      - "8000"

    volumes:
      - ./media:/app/media
      - ternnest_static_data:/app/staticfiles

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:stable-alpine3.24-slim
    container_name: ternnest_nginx
    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8000}:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ternnest_static_data:/var/www/static:ro
      - ./media:/var/www/media:ro


volumes:
  ternnest_mysql_data:
  ternnest_static_data:
