{% extends "frontend/base.html" %}
{% load static %}

{% block title %}Log in | TernNest{% endblock %}

{% block content %}
    <section class="auth-section">
        <div class="container">
            <div class="form-card">
                <div class="form-card__heading">
                    <span class="eyebrow">Welcome back</span>
                    <h1>Log in to TernNest</h1>

                    <p>
                        Access your bookings, listings and saved homes.
                    </p>
                </div>

                <form id="login-form" class="form-stack">
                    <label class="form-field">
                        <span>Email address</span>

                        <input
                            type="email"
                            name="email"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Password</span>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </label>

                    <div
                        id="login-message"
                        class="form-message"
                        hidden
                    ></div>

                    <button
                        id="login-submit-button"
                        class="button button--primary button--full"
                        type="submit"
                    >
                        Log in
                    </button>
                </form>

                <p class="form-card__footer">
                    Don’t have an account?

                    <a href="{% url 'frontend:register' %}">
                        Create one
                    </a>
                </p>
            </div>
        </div>
    </section>
{% endblock %}

{% block extra_js %}
    <script
        src="{% static 'frontend/js/login.js' %}"
        defer
    ></script>
{% endblock %}
