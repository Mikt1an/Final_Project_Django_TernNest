{% extends "frontend/base.html" %}

{% block title %}Create account | TernNest{% endblock %}

{% block content %}
    <section class="auth-section">
        <div class="container">
            <div class="form-card form-card--wide">
                <div class="form-card__heading">
                    <span class="eyebrow">Join TernNest</span>
                    <h1>Create your account</h1>

                    <p>
                        Book your next stay or list your own home.
                    </p>
                </div>

                <form
                    id="register-form"
                    class="form-grid"
                    method="post"
                    action="{% url 'accounts:register' %}"
                >
                    <label class="form-field">
                        <span>First name</span>

                        <input
                            type="text"
                            name="first_name"
                            placeholder="First name"
                            autocomplete="given-name"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Last name</span>

                        <input
                            type="text"
                            name="last_name"
                            placeholder="Last name"
                            autocomplete="family-name"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Email address</span>

                        <input
                            type="email"
                            name="email"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Phone number</span>

                        <input
                            type="tel"
                            name="phone_number"
                            placeholder="+491701234567"
                            autocomplete="tel"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Birthday</span>

                        <input
                            type="date"
                            name="birth_date"
                            autocomplete="bday"
                        >
                    </label>

                    <div class="form-field form-field--placeholder"></div>

                    <label class="form-field">
                        <span>Password</span>

                        <input
                            type="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >
                    </label>

                    <label class="form-field">
                        <span>Confirm password</span>

                        <input
                            type="password"
                            name="password_confirm"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            required
                        >
                    </label>

                    <div
                        id="register-message"
                        class="form-message form-field--full"
                        role="status"
                        aria-live="polite"
                        style="white-space: pre-line;"
                        hidden
                    ></div>

                    <button
                        id="register-submit-button"
                        class="button button--primary button--full form-field--full"
                        type="submit"
                    >
                        Create account
                    </button>
                </form>

                <p class="form-card__footer">
                    Already have an account?

                    <a href="{% url 'frontend:login' %}">
                        Log in
                    </a>
                </p>
            </div>
        </div>
    </section>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("register-form");
    const message = document.getElementById("register-message");
    const submitButton = document.getElementById(
        "register-submit-button"
    );

    if (!form || !message || !submitButton) {
        return;
    }

    function showMessage(text, type) {
        message.textContent = text;
        message.className =
            `form-message form-message--${type} form-field--full`;
        message.hidden = false;
    }

    function getErrorMessage(data, status) {
        if (data && typeof data === "object") {
            const messages = Object.entries(data).map(
                ([field, errors]) => {
                    const text = Array.isArray(errors)
                        ? errors.join(" ")
                        : String(errors);

                    return `${field}: ${text}`;
                }
            );

            if (messages.length) {
                return messages.join("\n");
            }
        }

        return `Registration failed (${status}). Please try again.`;
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (submitButton.disabled) {
            return;
        }

        message.hidden = true;

        if (!form.reportValidity()) {
            return;
        }

        const payload = Object.fromEntries(new FormData(form));

        payload.first_name = payload.first_name.trim();
        payload.last_name = payload.last_name.trim();
        payload.email = payload.email.trim();
        payload.phone_number = payload.phone_number.replace(/\s+/g, "");

        if (!payload.birth_date) {
            delete payload.birth_date;
        }

        if (payload.password !== payload.password_confirm) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Creating account...";

        let registered = false;

        try {
            const response = await fetch(form.action, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                body: JSON.stringify(payload),
            });

            const data = await response.json().catch(() => ({}));

            if (response.status !== 201) {
                showMessage(
                    getErrorMessage(data, response.status),
                    "error"
                );
                return;
            }

            registered = true;

            showMessage(
                "Account created successfully. Redirecting to login...",
                "success"
            );

            window.location.assign("{% url 'frontend:login' %}");
        } catch (error) {
            showMessage(
                "Could not connect to the server. Please try again.",
                "error"
            );
        } finally {
            if (!registered) {
                submitButton.disabled = false;
                submitButton.textContent = "Create account";
            }
        }
    });
});
</script>
{% endblock %}
